# Nombre de la aplicación
spring.application.name=api

# Configuración de Base de Datos (PostgreSQL)
spring.datasource.url=${FINDIMO_DB_URL:jdbc:postgresql://localhost:5432/bdFindimo}
spring.datasource.username=${FINDIMO_DB_USER:postgres}
spring.datasource.password=${FINDIMO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Puerto del servidor
server.port=8080
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Fotos de viviendas guardadas fuera del código fuente
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
